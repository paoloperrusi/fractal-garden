<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fractal Tree Garden</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 14px;
    color: rgba(255,255,255,0.55);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    pointer-events: none;
    line-height: 1.6;
    user-select: none;
  }
  #hud b { color: rgba(255,255,255,0.85); }
  #hudToggleBtn {
    pointer-events: auto;
    margin-top: 6px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    padding: 3px 7px;
    cursor: pointer;
  }
  #hudToggleBtn:hover { background: rgba(255,255,255,0.15); }
  #hudToggleBtn.faded {
    margin-top: 0;
    background: transparent;
    border-color: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.28);
  }
  #hudToggleBtn.faded:hover { background: rgba(255,255,255,0.08); }
  #panel {
    position: fixed; top: 14px; right: 14px;
    background: rgba(20,20,22,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 0 12px 12px;
    color: rgba(255,255,255,0.75);
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    width: 270px;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
  }
  #panelTabs { display: flex; gap: 4px; margin: 10px 0 10px; position: sticky; top: 0; background: inherit; padding-top: 2px; }
  #panelTabs button {
    flex: 1 1 auto;
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    padding: 5px 4px;
    cursor: pointer;
  }
  #panelTabs button.active { background: rgba(255,255,255,0.9); color: #111; border-color: rgba(255,255,255,0.9); }
  #panel .row { margin-bottom: 9px; }
  #panel .row:last-child { margin-bottom: 0; }
  #panel label { display: block; margin-bottom: 4px; }
  #panel .btnrow { display: flex; gap: 4px; flex-wrap: wrap; }
  #panel #speedRow, #panel #stSpeedRow { gap: 2px; flex-wrap: nowrap; }
  #panel #speedRow button, #panel #stSpeedRow button {
    font-size: 9px;
    padding: 4px 1px;
    min-width: 0; /* flex items default to min-width:auto (their content's natural width), which blocks shrinking below that even with flex-shrink:1 — this was the other half of why they kept wrapping */
  }
  #panel button {
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    padding: 4px 6px;
    cursor: pointer;
    flex: 1 1 auto;
  }
  #panel button:hover { background: rgba(255,255,255,0.18); }
  #panel button.active {
    background: rgba(255,255,255,0.9);
    color: #111;
    border-color: rgba(255,255,255,0.9);
  }
  #clearGardenBtn {
    background: rgba(120,20,20,0.35);
    border-color: rgba(255,90,90,0.35);
    color: rgba(255,210,210,0.85);
  }
  #clearGardenBtn:hover { background: rgba(150,25,25,0.5); }
  #genTreeDropdown, #eventDropdown {
    margin-top: 9px;
    padding: 8px 0 2px;
    border-top: 1px solid rgba(255,255,255,0.15);
  }
  #genTreeDropdown label, #eventDropdown label, #panel .row label {
    display: block;
    margin: 7px 0 4px;
    font-size: 10px;
    color: rgba(255,255,255,0.5);
  }
  #genTreeDropdown label:first-child, #eventDropdown label:first-child { margin-top: 0; }
  #panel select {
    width: 100%;
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    background: #1a1a1e; /* opaque — a transparent overlay only worked for the closed box and left the native option-list popup unstyled/white */
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    padding: 4px 6px;
  }
  #panel option {
    background: #1a1a1e;
    color: rgba(255,255,255,0.9);
  }
  #genTreeSpawnBtn { margin-top: 8px; }
  #eventGoBtn { margin-top: 8px; }
  #panel input[type=range] {
    width: 100%;
    accent-color: rgba(255,255,255,0.8);
  }
  #panel .sliderVal { color: rgba(255,255,255,0.9); float: right; }
  #eventBanner {
    display: none;
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    pointer-events: none;
    user-select: none;
  }
  #errBanner {
    display: none;
    position: fixed; bottom: 12px; left: 12px; right: 12px;
    color: #ff8080;
    background: rgba(40,10,10,0.7);
    border: 1px solid rgba(255,100,100,0.4);
    border-radius: 5px;
    padding: 8px 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    white-space: pre-wrap;
    pointer-events: none;
    user-select: text;
    z-index: 9999;
  }
</style>
</head>
<body>
<div id="eventBanner"></div>
<div id="errBanner"></div>
<div id="hud">
  <div id="hudContent">
    <b>W A S D</b> move<br>
    <b>Q</b> / <b>E</b> fly up/down (fly mode)<br>
    <b>Space</b> jump (walk mode)<br>
    <b>Space Space</b> toggle fly/walk<br>
    <b>click + drag</b> to look around<br>
    <b>O</b> full view<br>
    <b>&uarr;</b> / <b>&darr;</b> growth speed<br>
    <b>&larr;</b> / <b>&rarr;</b> tree count<br>
    <span id="treecount"></span><br>
  </div>
  <button id="hudToggleBtn">hide guide (H)</button>
</div>
<div id="panel">
  <div id="panelTabs">
    <button id="tabGardenBtn" class="active">garden</button>
    <button id="tabSingleTreeBtn">single tree</button>
  </div>

  <div class="row btnrow">
    <button id="floorToggleBtn" style="flex:1;">floor</button>
    <button id="fogToggleBtn" style="flex:1;">fog</button>
    <button id="windToggleBtn" style="flex:1;">wind</button>
  </div>

  <div id="gardenTab">
    <div class="row">
      <label>speed</label>
      <div class="btnrow" id="speedRow"></div>
    </div>
    <div class="row">
      <label>max concurrent trees</label>
      <div class="btnrow" id="countRow"></div>
    </div>
    <div class="row">
      <button id="genTreeBtn" style="width:100%;">+ generate tree</button>
      <div id="genTreeDropdown" style="display:none;">
        <label>algorithm</label>
        <select id="genAlgoSelect"></select>
        <label>style</label>
        <select id="genStyleSelect"></select>
        <button id="genTreeSpawnBtn" style="width:100%;">spawn</button>
      </div>
    </div>
    <div class="row">
      <button id="specialTreesBtn" style="width:100%;">special trees</button>
    </div>
    <div class="row">
      <button id="clearGardenBtn" style="width:100%;">clear &amp; respawn garden (C)</button>
    </div>
    <div class="row">
      <button id="eventTriggerBtn" style="width:100%;">+ trigger event</button>
      <div id="eventDropdown" style="display:none;">
        <label>event</label>
        <select id="eventSelect"></select>
        <button id="eventGoBtn" style="width:100%;">trigger</button>
      </div>
    </div>
    <div class="row">
      <button id="screenshotBtn" style="width:100%;">save screenshot</button>
    </div>
    <div class="row btnrow">
      <button id="flyWalkBtn" style="flex:1;">fly</button>
      <button id="fullViewBtn" style="flex:1;">full view</button>
    </div>
    <div class="row" id="rotateStopRow" style="display:none;">
      <button id="rotateStopBtn" style="width:100%;">stop rotation</button>
    </div>
  </div>

  <div id="singleTreeTab" style="display:none;">
    <div class="row btnrow">
      <button id="stSubCreativeBtn" style="flex:1;">creative</button>
      <button id="stSubRandomBtn" style="flex:1;">random showcase</button>
    </div>
    <div class="row">
      <label>generation speed</label>
      <div class="btnrow" id="stSpeedRow"></div>
    </div>
    <div class="row">
      <label>algorithm</label>
      <select id="stAlgoSelect"></select>
      <label>style</label>
      <select id="stStyleSelect"></select>
    </div>
    <div class="row">
      <label>branchiness</label>
      <div class="btnrow" id="stBranchRow"></div>
    </div>
    <div class="row">
      <label>jitter (gnarliness)</label>
      <div class="btnrow" id="stJitterRow"></div>
    </div>
    <div class="row">
      <label>jitter gradient (low rank &rarr; high rank)</label>
      <div class="btnrow" id="stGradientRow"></div>
    </div>
    <div class="row">
      <label>max iteration count</label>
      <div class="btnrow" id="stMaxIterRow"></div>
    </div>
    <div class="row">
      <button id="stRegenBtn" style="width:100%;">regenerate tree (R)</button>
    </div>
    <div class="row">
      <label>rotation speed</label>
      <div class="btnrow" id="stRotRow"></div>
    </div>
    <div class="row">
      <label>zoom <span class="sliderVal" id="stZoomVal"></span></label>
      <input type="range" id="stZoomSlider" min="0.15" max="32" step="0.05">
    </div>
    <div class="row">
      <label>angle <span class="sliderVal" id="stAngleVal"></span></label>
      <input type="range" id="stAngleSlider" min="2" max="88" step="1">
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>

// ============================================================================
//  FRACTAL TREE GARDEN — v3
//  True volumetric branch generation, a baked terrain mesh with a procedural
//  grey tile texture, a bounded fly camera, two live sliders, and REAL
//  shadow mapping (hand-rolled: p5.js has no built-in shadow support — see
//  the chat explanation for how the depth-texture pass + custom shader work).
// ============================================================================

let camPos, camYaw, camPitch;

// Shows the first caught error on screen (bottom of page) instead of just
// the console, since a black canvas alone gives no clue what broke.
let errorShown = false;
function reportError(msg) {
  if (errorShown) return;
  errorShown = true;
  const el = document.getElementById('errBanner');
  el.textContent = 'Something failed and was caught so the rest of the scene can keep rendering:\n' + msg;
  el.style.display = 'block';
}
let keys = {};

const WORLD_UP = { x: 0, y: 1, z: 0 }; // standard p5 WEBGL up vector (y grows downward)

// ---- navigable bounds --------------------------------------------------
const FLOOR_SIZE = 4200;               // much larger world
const NAV_MARGIN = 90;
const NAV_LIMIT = FLOOR_SIZE / 2 - NAV_MARGIN;
const CAM_MAX_HEIGHT = -1500;  // ceiling

// ---- terrain -------------------------------------------------------------
const FLOOR_DIV = 50;         // scaled up with FLOOR_SIZE to keep facet size similar
const TERRAIN_AMP = 95;
const TERRAIN_FREQ = 0.0032;
const TERRAIN_FREQ2 = 0.011;  // second octave for extra roughness/detail

// ---- floor color (lighting/shadows removed for now) ------------------------
const FLOOR_BASE_COLOR = [128, 128, 132]; // plain grey, no texture

// ---- fog -------------------------------------------------------------------
// distances are tuned relative to the world size so they scale if it changes
const FOG_NEAR = NAV_LIMIT * 0.45;
const FOG_FAR  = NAV_LIMIT * 1.55;

// ---- "fall"-style tree variants: falling particles ------------------------
const FALL_GRAVITY = 0.00025; // world units / ms^2
// per-variant {treeColor, particleColor} — a tree can drop a different
// color of particle than its own branch color (e.g. the cyan "magic" tree
// drops gold particles).
const PARTICLE_VARIANTS = {
  fall:  { treeColor: [235, 110, 45],  particleColor: [235, 110, 45] },
  blood: { treeColor: [150, 15, 15],   particleColor: [180, 20, 20] },
  magic: { treeColor: [70, 220, 230],  particleColor: [255, 205, 90] }
};

// ---- sim time (drives growth-speed control) --------------------------------
let simTime = 0;
let growthSpeed = 1.0;
let paused = false;
// Single-tree mode has its own independent clock/speed/pause — deliberately
// NOT the same as the garden's, so tweaking one never affects the other.
let stSimTime = 0;
let stGrowthSpeed = 1;
let stPaused = false;
// Whichever clock is relevant for the currently-visible trees this frame —
// set once per frame in draw(). Growth timing, particle aging, flicker/
// shimmer/sway animations all read this instead of simTime directly, so
// single-tree mode's visuals follow its own clock automatically.
let currentTimeRef = 0;
let currentEffSpeed = 1; // same idea as currentTimeRef, but for per-frame delta scaling (e.g. particle physics)

// ---- trees -------------------------------------------------------------------
let trees = [];
let maxTrees = 6;
const SPAWN_RADIUS = NAV_LIMIT * 0.85;
const MIN_TREE_GAP = 340;      // bigger trees need more room
let lastTrimTime = 0;

// ---- fly / walk ground movement ---------------------------------------------
let flyMode = true;
const GROUND_CLEARANCE = 70;  // walk/fly minimum height above the actual (curved) terrain below the camera — was 26, too small relative to the world's scale and was letting the camera sit close enough to clip into nearby terrain
let jumpOffset = 0;           // extra height above the walking baseline, from a jump
let jumpVelocity = 0;         // units/ms, positive = still rising
const JUMP_SPEED = 0.62;
const JUMP_GRAVITY = 0.0016;
let lastSpaceTime = -99999;
const DOUBLE_TAP_MS = 350;

// ---- full view (aerial) camera ----------------------------------------------
let orbitMode = false;
let orbitAngle = 0;
let aerialRotating = true;
const AERIAL_RADIUS = NAV_LIMIT * 2.1;    // doubled — further out than before
const AERIAL_HEIGHT = -2300;              // doubled — full view is a deliberately over-the-top cinematic shot, not bound by the normal fly ceiling
const AERIAL_TARGET = { x: 0, y: -140, z: 0 }; // aimed lower (near ground), a proper "looking down" angle
const ORBIT_SPEED = 0.00011; // radians per ms
let eyePos = { x: 0, y: -240, z: 560 }; // current camera eye, used for fog distance too

// ---- single-tree viewer ------------------------------------------------------
let singleTreeMode = false;
let singleTreeSubMode = 'creative'; // 'creative' or 'random'
let singleTreeArr = [];
let stRotSpeed = 1;   // 0 = fully stopped
let stZoom = 1;
let stAngle = 26;     // degrees of elevation
let stOrbitAngle = 0;
const ST_BASE_RADIUS = 260;
let stAlgoKey = 'lsystem';
let stStyleKey = 'normal';
let stBranchiness = 0.6;      // 0..1, real-time-adjustable canopy bias
let stJitter = 1.0;           // real-time-adjustable jitter multiplier
let stJitterGradient = 0;     // -1..1, low-rank-to-high-rank jitter ramp (single-tree mode only)
let stMaxIter = 0;            // max iteration/recursion depth override — 0 = auto (use the style's default)

function getActiveTrees() { return singleTreeMode ? singleTreeArr : trees; }

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);

  angleMode(RADIANS);
  camPos = createVector(0, -240, 560);
  camYaw = PI;
  camPitch = -0.22;

  try {
    buildFloorGeometry();
  } catch (e) {
    console.error('Terrain build failed.', e);
    reportError('terrain build: ' + e.message);
  }

  try {
    buildControls();
  } catch (e) {
    console.error('UI controls failed to build.', e);
    reportError('controls setup: ' + e.message);
  }

  nextEventTime = random(EVENT_MIN_GAP, EVENT_MAX_GAP);

  try {
    for (let i = 0; i < 3; i++) spawnTree(true);
  } catch (e) {
    console.error('Initial tree spawn failed.', e);
    reportError('initial spawn: ' + e.message);
  }

  frameRate(60);
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

// ---------------------------------------------------------------------------
// UI CONTROLS — buttons, each steppable by keyboard too
// ---------------------------------------------------------------------------
function makeButtonGroup(containerId, values, current, formatLabel, onPick) {
  const row = document.getElementById(containerId);
  const group = { values, index: Math.max(0, values.indexOf(current)), onPick, btns: [] };
  group.btns = values.map((v, i) => {
    const b = document.createElement('button');
    b.textContent = formatLabel(v);
    if (i === group.index) b.classList.add('active');
    b.addEventListener('click', () => group.select(i));
    row.appendChild(b);
    return b;
  });
  group.select = (idx) => {
    idx = constrain(idx, 0, group.values.length - 1);
    group.index = idx;
    group.btns.forEach(x => x.classList.remove('active'));
    group.btns[idx].classList.add('active');
    group.onPick(group.values[idx]);
  };
  return group;
}

let speedGroup, countGroup;

function buildControls() {
  // tabs
  const tabGardenBtn = document.getElementById('tabGardenBtn');
  const tabSingleTreeBtn = document.getElementById('tabSingleTreeBtn');
  const gardenTab = document.getElementById('gardenTab');
  const singleTreeTab = document.getElementById('singleTreeTab');
  tabGardenBtn.addEventListener('click', () => {
    tabGardenBtn.classList.add('active'); tabSingleTreeBtn.classList.remove('active');
    gardenTab.style.display = 'block'; singleTreeTab.style.display = 'none';
    setSingleTreeMode(false);
  });
  tabSingleTreeBtn.addEventListener('click', () => {
    tabSingleTreeBtn.classList.add('active'); tabGardenBtn.classList.remove('active');
    singleTreeTab.style.display = 'block'; gardenTab.style.display = 'none';
    setSingleTreeMode(true);
  });

  // 0x is folded into the speed buttons themselves (first/leftmost) instead
  // of a separate pause button, to save panel space.
  speedGroup = makeButtonGroup('speedRow', [0, 0.25, 0.5, 1, 1.5, 2, 3, 4, 6], growthSpeed,
    v => v + 'x',
    v => { if (v === 0) { paused = true; } else { paused = false; growthSpeed = v; } });

  countGroup = makeButtonGroup('countRow', [1, 2, 4, 6, 9, 12, 16, 20, 25], maxTrees,
    v => String(v),
    v => { maxTrees = v; });

  document.getElementById('hudToggleBtn').addEventListener('click', toggleHud);

  // "generate tree" — button opens a small dropdown to pick algorithm + style
  const algoSelect = document.getElementById('genAlgoSelect');
  GENERATION_ALGORITHMS.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.key; opt.textContent = a.label;
    algoSelect.appendChild(opt);
  });
  const styleSelect = document.getElementById('genStyleSelect');
  STYLE_OPTIONS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.key; opt.textContent = s.label;
    styleSelect.appendChild(opt);
  });

  const dropdown = document.getElementById('genTreeDropdown');
  document.getElementById('genTreeBtn').addEventListener('click', () => {
    dropdown.style.display = (dropdown.style.display === 'none') ? 'block' : 'none';
  });
  document.getElementById('genTreeSpawnBtn').addEventListener('click', () => {
    spawnCustomTree(algoSelect.value, styleSelect.value);
  });

  // floor / fog / wind — filled (.active) = on, matching the fly/full-view
  // buttons' convention; static label text, no more text-swapping.
  const floorBtn = document.getElementById('floorToggleBtn');
  floorBtn.classList.toggle('active', floorVisible);
  floorBtn.addEventListener('click', () => {
    floorVisible = !floorVisible;
    floorBtn.classList.toggle('active', floorVisible);
  });

  const fogBtn = document.getElementById('fogToggleBtn');
  fogBtn.classList.toggle('active', fogEnabled);
  fogBtn.addEventListener('click', () => {
    fogEnabled = !fogEnabled;
    fogBtn.classList.toggle('active', fogEnabled);
  });

  const windBtn = document.getElementById('windToggleBtn');
  windBtn.classList.toggle('active', windEnabled);
  windBtn.addEventListener('click', () => {
    windEnabled = !windEnabled;
    windBtn.classList.toggle('active', windEnabled);
  });

  // "special trees" — filled (.active) = enabled (default). Disabling forces
  // every new garden spawn to plain 'normal', and suppresses events (since
  // they'd have nothing to do while every spawn gets overridden anyway).
  const specialBtn = document.getElementById('specialTreesBtn');
  specialBtn.classList.toggle('active', !specialTreesDisabled);
  specialBtn.addEventListener('click', () => {
    specialTreesDisabled = !specialTreesDisabled;
    specialBtn.classList.toggle('active', !specialTreesDisabled);
  });

  document.getElementById('clearGardenBtn').addEventListener('click', clearGarden);

  // "trigger event" — force-start any of the available periodic events on
  // demand, overriding whatever the automatic timer was doing.
  const eventSelect = document.getElementById('eventSelect');
  SPECIAL_VARIANTS.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.key; opt.textContent = EVENT_LABELS[v.key] || v.key;
    eventSelect.appendChild(opt);
  });
  const eventDropdown = document.getElementById('eventDropdown');
  document.getElementById('eventTriggerBtn').addEventListener('click', () => {
    eventDropdown.style.display = (eventDropdown.style.display === 'none') ? 'block' : 'none';
  });
  document.getElementById('eventGoBtn').addEventListener('click', () => {
    triggerEvent(eventSelect.value);
  });

  document.getElementById('screenshotBtn').addEventListener('click', () => {
    saveCanvas('fractal-garden', 'png');
  });

  // fly/walk + full view + rotate/stop
  document.getElementById('flyWalkBtn').addEventListener('click', () => {
    flyMode = !flyMode;
    updateFlyWalkButton();
  });
  document.getElementById('fullViewBtn').addEventListener('click', () => {
    if (!singleTreeMode) orbitMode = !orbitMode;
    updateFullViewButton();
  });
  document.getElementById('rotateStopBtn').addEventListener('click', () => {
    aerialRotating = !aerialRotating;
    updateRotateStopButton();
  });
  updateFlyWalkButton();
  updateFullViewButton();
  updateRotateStopButton();

  const stAlgoSelect = document.getElementById('stAlgoSelect');
  GENERATION_ALGORITHMS.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.key; opt.textContent = a.label;
    stAlgoSelect.appendChild(opt);
  });
  stAlgoSelect.value = stAlgoKey;
  // settings only — the tree doesn't rebuild until "regenerate tree" (or R) is pressed
  stAlgoSelect.addEventListener('change', () => { stAlgoKey = stAlgoSelect.value; });

  const stStyleSelect = document.getElementById('stStyleSelect');
  STYLE_OPTIONS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.key; opt.textContent = s.label;
    stStyleSelect.appendChild(opt);
  });
  stStyleSelect.value = stStyleKey;
  stStyleSelect.addEventListener('change', () => { stStyleKey = stStyleSelect.value; });

  const stSubCreativeBtn = document.getElementById('stSubCreativeBtn');
  const stSubRandomBtn = document.getElementById('stSubRandomBtn');
  function updateSubModeButtons() {
    stSubCreativeBtn.classList.toggle('active', singleTreeSubMode === 'creative');
    stSubRandomBtn.classList.toggle('active', singleTreeSubMode === 'random');
  }
  stSubCreativeBtn.addEventListener('click', () => {
    singleTreeSubMode = 'creative'; updateSubModeButtons();
  });
  stSubRandomBtn.addEventListener('click', () => {
    singleTreeSubMode = 'random'; updateSubModeButtons();
    if (singleTreeMode) spawnSingleTree(true);
  });
  updateSubModeButtons();

  // independent single-tree generation speed — deliberately separate
  // variables from the garden's speed/pause, per your note.
  stSpeedGroup = makeButtonGroup('stSpeedRow', [0, 0.25, 0.5, 1, 1.5, 2, 3, 4, 6], stGrowthSpeed,
    v => v + 'x',
    v => { if (v === 0) { stPaused = true; } else { stPaused = false; stGrowthSpeed = v; } });

  stBranchGroup = makeButtonGroup('stBranchRow', [0, 0.25, 0.5, 0.75, 1], stBranchiness,
    v => v.toFixed(2).replace(/\.?0+$/, '') || '0',
    v => { stBranchiness = v; });

  stJitterGroup = makeButtonGroup('stJitterRow', [0.3, 0.7, 1, 1.5, 2.5], stJitter,
    v => v + 'x',
    v => { stJitter = v; });

  stGradientGroup = makeButtonGroup('stGradientRow', [-1, -0.5, 0, 0.5, 1], stJitterGradient,
    v => (v > 0 ? '+' : '') + v,
    v => { stJitterGradient = v; });

  stMaxIterGroup = makeButtonGroup('stMaxIterRow', [0, 5, 7, 9, 11, 14, 18, 24], stMaxIter,
    v => v === 0 ? 'auto' : String(v),
    v => { stMaxIter = v; });

  stRotGroup = makeButtonGroup('stRotRow', [0, 0.25, 0.5, 1, 2, 3], stRotSpeed,
    v => v + 'x',
    v => { stRotSpeed = v; }); // real-time — no regenerate needed

  // zoom / angle — sliders, much wider range so you can pull back far
  // further than the old button-stepped version allowed. Both apply live.
  // Zoom: the slider itself stays a normal left-to-right control (so its
  // track fill renders identically to the angle slider below it — CSS
  // direction:rtl looked broken because most browsers reverse the thumb but
  // not the fill). Instead the raw 0.15–16 slider position is reflected
  // in JS before being used as stZoom, so dragging right still zooms in
  // (closer) and left zooms out (further), matching the label at a glance.
  const ZOOM_MIN = 0.15, ZOOM_MAX = 32;
  const stZoomSlider = document.getElementById('stZoomSlider');
  const stZoomVal = document.getElementById('stZoomVal');
  stZoomSlider.value = ZOOM_MIN + ZOOM_MAX - stZoom;
  stZoomVal.textContent = stZoom.toFixed(2) + 'x';
  stZoomSlider.addEventListener('input', () => {
    stZoom = ZOOM_MIN + ZOOM_MAX - parseFloat(stZoomSlider.value);
    stZoomVal.textContent = stZoom.toFixed(2) + 'x';
  });

  const stAngleSlider = document.getElementById('stAngleSlider');
  const stAngleVal = document.getElementById('stAngleVal');
  stAngleSlider.value = stAngle;
  stAngleVal.textContent = Math.round(stAngle) + '\u00b0';
  stAngleSlider.addEventListener('input', () => {
    stAngle = parseFloat(stAngleSlider.value);
    stAngleVal.textContent = Math.round(stAngle) + '\u00b0';
  });

  document.getElementById('stRegenBtn').addEventListener('click', regenerateOrCycle);
}

// The one and only action that rebuilds the tree — used by the button, the

  if (singleTreeSubMode === 'random') spawnSingleTree(true); else regenerateSingleTree();
}

let stBranchGroup, stJitterGroup, stGradientGroup, stRotGroup, stSpeedGroup, stMaxIterGroup;
